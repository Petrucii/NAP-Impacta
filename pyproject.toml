[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "dist", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
